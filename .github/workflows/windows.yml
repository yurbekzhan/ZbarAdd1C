name: Windows x64
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build component and bundled dependencies
        shell: pwsh
        run: |
          & cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -Variable buildOutput
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $buildOutput | Where-Object { $_ -match '(?i)(error (?:C|LNK)[0-9]+|fatal error|FAILED:|CMake Error)' } | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$_" }
            exit $buildExitCode
          }
      - name: Functional and Native API tests
        shell: pwsh
        run: |
          & ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -Variable testOutput
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $testOutput | Select-Object -Last 50 | ForEach-Object { Write-Output "::error::$_" }
            exit $testExitCode
          }
      - name: Diagnose runtime failure with AddressSanitizer
        if: failure()
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $compiler = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $env:PATH = "$($compiler.DirectoryName);$env:PATH"
          cmake -S . -B build-asan -G "Visual Studio 17 2022" -A x64 '-DCMAKE_C_FLAGS=/fsanitize=address /Zi' '-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-asan --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ctest --test-dir build-asan -C Release --output-on-failure 2>&1 | Tee-Object -Variable diagnosticOutput
          $diagnosticExitCode = $LASTEXITCODE
          if ($diagnosticExitCode -ne 0) {
            $diagnosticOutput | Select-Object -Last 100 | ForEach-Object { Write-Output "::error::$_" }
          }
          exit $diagnosticExitCode
      - name: Check DLL dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $result = & $dumpbin.FullName /dependents build/Release/ZbarAdd1C.dll
          $result
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
          if ($result -match '(?i)^\s+(?:(?:lib)?(?:zbar|png|zlib|iconv)|vcruntime|msvcp)[^\s]*\.dll\s*$') { throw "Unexpected dependency DLL" }
      - uses: actions/upload-artifact@v4
        with:
          name: ZbarAdd1C-win64
          path: build/dist/Release/ZbarAdd1C-win64.zip
